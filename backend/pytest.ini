[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for CI selective runs
markers =
    smoke: quick sanity tests that must pass on every deploy (no demo data required)
    integration: tests requiring seed demo data (SEED_DEMO_DATA=true)
    slow: tests that take > 5 seconds

# Default addopts
addopts =
    -ra
    --strict-markers
    --tb=short
