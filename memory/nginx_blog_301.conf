# Nginx 301 redirect map — Blog ObjectId → slug
#
# Usage: on the VPS, inside the server block for funzionabene.it, add:
#   include /etc/nginx/snippets/blog_301.conf;
#
# This performs HTTP 301 permanent redirects at edge BEFORE the request
# reaches the Node/FastAPI backend or the static React app. Preserves SEO link juice.
#
# Generated: 2026-02-21 — Fase D Blog Slug Migration

# ─── Mapping table ─────────────────────────────────────────────────────────
# nginx `map` directive: match the full URI (NOT just the ObjectId path segment)
# because /blog/<id>/ with trailing slash must also redirect.

map $uri $blog_slug_target {
    default                                             "";
    "~^/blog/6a95319d10ccafc2ca1d6138/?$"                /blog/il-desiderio-sessuale-cos-e-come-cambia-e-quando-ascoltarlo;
    "~^/blog/6a95319d10ccafc2ca1d6139/?$"                /blog/eiaculazione-precoce-oltre-il-tabu-verso-la-cura;
    "~^/blog/6a95319d10ccafc2ca1d613a/?$"                /blog/vaginismo-quando-il-corpo-chiede-protezione;
    "~^/blog/6a95319d10ccafc2ca1d613b/?$"                /blog/disfunzione-erettile-ritrovare-la-fiducia-nel-proprio-corpo;
    "~^/blog/6a95319d10ccafc2ca1d613c/?$"                /blog/l-orgasmo-femminile-un-viaggio-non-una-destinazione;
    "~^/blog/6a95319d10ccafc2ca1d613d/?$"                /blog/comunicazione-e-intimita-come-parlarsi-davvero;
    "~^/blog/6a95319d10ccafc2ca1d613e/?$"                /blog/la-sessualita-nel-tempo-cambia-ma-non-finisce;
    "~^/blog/6a95319d10ccafc2ca1d613f/?$"                /blog/orientamento-sessuale-e-identita-di-genere-un-percorso-di-scoperta;
    "~^/blog/6a95319d10ccafc2ca1d6140/?$"                /blog/il-desiderio-dopo-il-parto-ritrovarsi-nel-corpo-che-cambia;
    "~^/blog/6a95319d10ccafc2ca1d6141/?$"                /blog/pornografia-e-intimita-reale-quando-lo-schermo-prende-il-sopravvento;
    "~^/blog/6a95319d10ccafc2ca1d6142/?$"                /blog/anorgasmia-quando-il-piacere-sembra-lontano;
    "~^/blog/6a95319d10ccafc2ca1d6143/?$"                /blog/sessualita-e-malattia-cronica-il-corpo-cambia-il-piacere-puo-restare;
    "~^/blog/6a95319d10ccafc2ca1d6144/?$"                /blog/dispareunia-quando-fare-l-amore-fa-male;
    "~^/blog/6a95319d10ccafc2ca1d6145/?$"                /blog/immagine-corporea-e-sessualita-amarsi-per-amarsi;
    "~^/blog/6a95319d10ccafc2ca1d6146/?$"                /blog/la-terapia-sessuologica-cos-e-davvero-e-a-chi-si-rivolge;
}

# ─── Redirect rule ─────────────────────────────────────────────────────────
# Place this INSIDE the `server { ... }` block, before the SPA fallback try_files.
#
# if ($blog_slug_target) {
#     return 301 $blog_slug_target;
# }
#
# This causes a 301 Moved Permanently with Location: /blog/<slug>.
# All ObjectId URLs become permanent redirects. Crawlers follow and update their index.
#
# ─── Fallback: generic ObjectId pattern (not in map) ───────────────────────
# If an unknown ObjectId appears (deleted article, future article not yet migrated),
# the backend endpoint /api/public/blog/by-id/{id} will return either the slug (and
# the SPA redirects client-side) or a 404.
